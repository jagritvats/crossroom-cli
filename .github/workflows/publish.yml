# Publishes the `crossroom` command (packages/cli) to npm, and only when asked to in so many words:
# run it from the Actions tab, type the version packages/cli/package.json carries, and tick
# `release`. Unticked it is a dry run (build, smoke test, `npm publish --dry-run`). Nothing else
# publishes, a pushed tag included, and a version npm already has is refused before anything is built.
# It authenticates with the NPM_TOKEN secret (a granular token that may publish `crossroom`, with
# "Bypass two-factor authentication"), or with npm trusted publishing set up for this workflow.
name: publish

on:
  workflow_dispatch:
    inputs:
      version:
        description: The version to publish, exactly as packages/cli/package.json has it
        type: string
        required: true
      release:
        description: Publish to npm. Leave unticked for a dry run
        type: boolean
        default: false

concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      # The version typed must be the one the package carries, and one npm does not have yet.
      - name: Check the version
        env:
          WANTED: ${{ inputs.version }}
        run: |
          version="$(node -p "require('./packages/cli/package.json').version")"
          if [ "$WANTED" != "$version" ]; then
            echo "::error::Asked for $WANTED, but packages/cli/package.json is $version. Nothing was published." >&2
            exit 1
          fi
          if npm view "crossroom@$version" version >/dev/null 2>&1; then
            echo "::error::crossroom@$version is already on npm. Raise the version first. Nothing was published." >&2
            exit 1
          fi

      - run: pnpm typecheck

      - run: pnpm build

      - name: Smoke test the built command
        run: |
          node packages/cli/dist/crossroom.mjs --version
          node packages/cli/dist/crossroom.mjs help start > /dev/null

      - name: Publish (dry run)
        if: ${{ !inputs.release }}
        working-directory: packages/cli
        run: npm publish --dry-run --access public

      - name: Publish
        if: ${{ inputs.release }}
        working-directory: packages/cli
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
