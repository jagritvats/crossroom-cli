# Publishes the `crossroom` command (packages/cli) to npm. Pushing a tag `v<version>` (the version in
# packages/cli/package.json) publishes it with provenance; running it from the Actions tab is a dry
# run unless dry_run is unticked. It authenticates with the NPM_TOKEN secret, or with npm trusted
# publishing set up for this repository and workflow, which needs no token.
name: publish

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and check the package without publishing it
        type: boolean
        default: true
  push:
    tags: ['v*']

concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      - name: Check the tag matches the package version
        if: github.event_name == 'push'
        run: |
          version="$(node -p "require('./packages/cli/package.json').version")"
          case "$GITHUB_REF_NAME" in
            "v$version"|"v$version-"*) ;;
            *) echo "Tag $GITHUB_REF_NAME does not name packages/cli version $version" >&2; exit 1 ;;
          esac

      - run: pnpm typecheck

      - run: pnpm build

      - name: Smoke test the built command
        run: |
          node packages/cli/dist/crossroom.mjs --version
          node packages/cli/dist/crossroom.mjs help start > /dev/null

      - name: Publish (dry run)
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run
        working-directory: packages/cli
        run: npm publish --dry-run --access public

      - name: Publish
        if: github.event_name == 'push' || !inputs.dry_run
        working-directory: packages/cli
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
